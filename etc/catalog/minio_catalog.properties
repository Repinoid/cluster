# Iceberg connector configuration
connector.name=iceberg
iceberg.catalog.type=hive_metastore

# Warehouse location - UNCOMMENT and use this
iceberg.warehouse=s3a://tiny/

# Hive metastore configuration
hive.metastore.uri=thrift://metastore:9083

# S3 configuration for Iceberg
iceberg.s3.aws-access-key=muser
iceberg.s3.aws-secret-key=mpassword
iceberg.s3.endpoint=http://minio-service:9000
iceberg.s3.path-style-access=true

# Optional: If the above doesn't work, try hive.s3 prefix instead
# hive.s3.aws-access-key=muser
# hive.s3.aws-secret-key=mpassword  
# hive.s3.endpoint=http://minio-service:9000
# hive.s3.path-style-access=true