# Iceberg connector configuration
connector.name=iceberg
iceberg.catalog.type=hive_metastore
# For warehouse location, use hive.warehouse-dir instead
hive.warehouse-dir=s3a://your-bucket/warehouse/

# Hive metastore configuration (shared between connectors)
hive.metastore.uri=thrift://metastore:9083

# S3 configuration - use direct S3 properties, not hive.s3.*
fs.native-s3.enabled=true
s3.aws-access-key=muser
s3.aws-secret-key=mpassword
s3.endpoint=http://minio-service:9000
s3.path-style-access=true
# Remove hive.s3.max-error-retries and hive.s3.retry-mode

# Remove these Hive-specific properties as they don't apply to Iceberg:
# hive.collect-column-statistics-on-write
# hive.non-managed-table-creates-enabled  
# hive.non-managed-table-writes-enabled
