services:
  # MinIO для объектного хранилища
  minio-service:
    image: quay.io/minio/minio:latest
    container_name: minio-container
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: muser
      MINIO_ROOT_PASSWORD: mpassword
      TZ: Europe/Moscow
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - trino-network

  # Автоматическое создание бакетов в MinIO
  createbuckets-service:
    image: quay.io/minio/mc:latest
    container_name: create-minio-buckets
    environment:
      TZ: Europe/Moscow    
    depends_on:
      - minio-service
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set localminio http://minio-service:9000 muser mpassword;
      /usr/bin/mc mb localminio/tiny;
      /usr/bin/mc mb localminio/trinod;
      exit 0;
      "
    networks:
      - trino-network

  # PostgreSQL для Hive Metastore
  metastore-db:
    image: postgres:17
    container_name: metastore-db
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: metastore
      POSTGRES_USER: hiveuser
      POSTGRES_PASSWORD: hivepassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/etc/postgresql.conf
      - ./postgresql/pg_hba.conf:/etc/pg_hba.conf
      - ./iceberg-setup.sql:/docker-entrypoint-initdb.d/iceberg-setup.sql

      - ./pg_logs:/var/log/postgresql

    command: postgres -c config_file=/etc/postgresql.conf -c hba_file=/etc/pg_hba.conf      
    # command: bash -c 'chown -R postgres:postgres /var/log/postgresql && exec postgres -c config_file=/etc/postgresql.conf -c hba_file=/etc/pg_hba.conf'    

    networks:
      - trino-network
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Необязательно, но хороший тон: явно сообщаем, что сервис зависит от здоровья БД
    restart: unless-stopped      

  # init-metastore-db:
  #   image: apache/hive:${HIVERSION}
  #   container_name: init-metastore-db
  #   environment:
  #     TZ: Europe/Moscow    
  #   depends_on:  
  #     metastore-db:
  #       condition: service_healthy  # Ждем, пока БД не станет "healthy"    
  #   volumes:
  #     - ./metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml
  #     - ./initm-entrypoint.sh:/entrypoint.sh
  #   entrypoint: ["/bin/sh", "/entrypoint.sh"]  # ← ПОЛНОСТЬЮ СВОЙ ENTRYPOINT
  #   networks:
  #     - trino-network
  #   # restart: on-failure


  # Trino coordinator
  trin:
    image: trinodb/trino:latest
    container_name: trin
    environment:
      TZ: Europe/Moscow    
    depends_on:
      # - metastore
      - minio-service
    ports:
      - "8080:8080"  # Trino UI
    volumes:
      - ./etc:/etc/trino  # Каталог с конфигурацией Trino (catalog.properties, etc.)
    networks:
      - trino-network

volumes:
  minio_data:
  postgres_data:

networks:
  trino-network:
    driver: bridge
